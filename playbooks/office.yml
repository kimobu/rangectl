---
# Load datas
- import_playbook: data.yml
  vars:
    data_path: "{{ rangectl_ad_data_path | default(rangectl_range_base ~ '/ad/' ~ domain_name ~ '/data') }}"
  tags: 'data'

- name: "Upload kms and office"
  hosts: files
  roles:
    - { role: 'office/upload', tags: 'upload'}
    
- name: Install office
  hosts: workstation
  roles:
    - { role: 'office/install', tags: 'install'}
    
