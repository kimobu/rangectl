- name: Allow credential owner to log on for credential staging
  ansible.windows.win_user_right:
    name: "{{ item.1 }}"
    users:
      - "{{ item.0.value.runas | default('Administrator') }}"
    action: add
  loop: "{{ vulns_vars | dict2items | product(['SeBatchLogonRight', 'SeInteractiveLogonRight']) | list }}"
  when: item.0.value.runas is defined

- name: Store a password in Credential Manager
  community.windows.win_credential:
    name: "{{ item.key }}"
    type: domain_password
    username: "{{ item.value.username }}"
    secret: "{{ item.value.secret }}"
    comment: "Credential for {{ item.value.username }}"
    persistence: local
    state: present
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{ item.value.runas | default('Administrator') }}"
    ansible_become_password: "{{ item.value.runas_password | default(local_admin_password) }}"
    ansible_become_flags: logon_type=batch logon_flags=with_profile
  ignore_errors: "{{ credentials_ignore_errors | default(false) }}"
  loop: "{{ vulns_vars | dict2items }}"
