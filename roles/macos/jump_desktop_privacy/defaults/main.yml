---
jump_desktop_privacy_enabled: true
jump_desktop_install_enabled: true
jump_desktop_cask: jump-desktop-connect
jump_desktop_brew_path: ""
jump_desktop_connect_code: "{{ lookup('env', 'JUMP_DESKTOP_CONNECT_CODE') | default('', true) }}"
jump_desktop_computer_name: "{{ inventory_hostname }}"
jump_desktop_vnc_enabled: true
jump_desktop_vnc_port: 5900
jump_desktop_rtc_enabled: true
jump_desktop_rtc_local_server: true
jump_desktop_direct_tcc_grant_enabled: true
jump_desktop_app_path: /Applications/Jump Desktop Connect.app
jump_desktop_cli_path: "{{ jump_desktop_app_path }}/Contents/MacOS/JumpConnect"
jump_desktop_privacy_profile_dir: /Library/Application Support/rangectl/profiles
jump_desktop_privacy_identifier: "local.rangectl.jump-desktop-privacy"
jump_desktop_privacy_profile_name: "Jump Desktop Privacy"
jump_desktop_privacy_organization: "rangectl"
jump_desktop_privacy_bundle_id: "com.p5sys.jump.connect"
jump_desktop_privacy_code_requirement: 'identifier "com.p5sys.jump.connect" and anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = "2HCKV38EEC"'
jump_desktop_direct_tcc_csreq_hex: ""
jump_desktop_privacy_profile_path: "{{ jump_desktop_privacy_profile_dir }}/30-jump-desktop-privacy.mobileconfig"
