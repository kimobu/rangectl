---
# Defaults for pfSense role
pfsense_backup_enabled: true
pfsense_backup_dir: /root/pfsense-backups
pfsense_ssh_wait_delay: 15
pfsense_ssh_wait_timeout: 600
pfsense_ssh_strict_host_key_checking: true
pfsense_ssh_known_hosts_file: ""

# Interface mapping (adjust to match your Proxmox NIC order / VLANs)
pfsense_wan_if: vtnet0
pfsense_internal1_if: vtnet1
pfsense_internal2_if: vtnet2
pfsense_internal3_if: vtnet3
pfsense_onion_if: vtnet4

# Redirector targets (override if IPs change)
redirector1_ip: "10.60.0.101"
redirector2_ip: "10.60.0.102"

# Interface addresses (set IPs here)
pfsense_interfaces:
  - { descr: "WAN", if: "{{ pfsense_wan_if }}", ip: "10.60.0.10", mask: 24 }
  - { descr: "INTERNAL_SERVERS", if: "{{ pfsense_internal1_if }}", ip: "192.168.10.1", mask: 24 }
  - { descr: "INTERNAL_WORKSTATIONS", if: "{{ pfsense_internal2_if }}", ip: "192.168.20.1", mask: 24 }
  - { descr: "INTERNAL_EXTRA", if: "{{ pfsense_internal3_if }}", ip: "192.168.30.1", mask: 24 }
  - { descr: "ONION_SPAN", if: "{{ pfsense_onion_if }}" }  # no IP

# Outbound NAT rules (backup shows mode: automatic; leave empty to stay automatic)
pfsense_outbound_nat: []

# NAT/port redirects. Content packs should define their own NAT table.
# WAN entries use destination=wanip. Internal-interface entries must include
# destination and are used for lab-safe redirects of public indicators back to
# local payload infrastructure.
pfsense_inbound_nat: []

# DNS resolver host overrides (backup showed none; add here if needed)
pfsense_dns_overrides: []

# Optional OpenVPN service. Client PKI/profile/auth artifacts are generated
# under the range state directory by `rangectl render`; the pfSense renderer consumes the
# same files so the server and planted client profile stay aligned.
pfsense_openvpn:
  enabled: false
  artifact_dir: "{{ rangectl_state_dir | default(playbook_dir ~ '/../../state/default') }}/vpn"
  name: lab-vpn
  description: Lab support VPN
  client_name: lab-vpn-client
  dns_server: 192.168.10.10
  maxclients: 5
  server:
    interface: wan
    port: 1194
    proto: udp
    tunnel_cidr: 10.250.40.0/24
  routes:
    - 192.168.10.25/32
    - 192.168.20.0/24
    - 192.168.30.0/24
