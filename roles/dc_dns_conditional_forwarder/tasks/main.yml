- name: "Add dns server zone" 
  community.windows.win_dns_zone:
    name: "{{item}}"
    type: forwarder
    replication: "{{replication}}"
    dns_servers:
      - "{{hostvars[dc].ansible_host}}"
  vars:
    ansible_become: yes
    ansible_become_method: runas
    ansible_become_user: "{{domain_username}}"
    ansible_become_password: "{{domain_password}}"
    dc_key: "{{ lab.domains[item].dc }}"
    dc: "{{ lab.hosts[dc_key].hostname | default(dc_key) }}"
  loop: "{{ domains }}"
  when: item != domain and item != parent_domain and '.'.join(item.split('.')[1:]) != domain

# when not same domain and not parent or child
